<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Histórico de Atendimentos</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #f5f5f5;
    }
    
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 2rem;
    }
    
    .header {
      text-align: center;
      margin-bottom: 2rem;
    }
    
    h1 {
      color: #e62e69;
      margin-bottom: 0.5rem;
    }
    
    .sessions-list {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }
    
    .session-card {
      background-color: #fff;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      overflow: hidden;
    }
    
    .session-info {
      padding: 1.5rem;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid #eee;
    }
    
    .client-info {
      display: flex;
      align-items: center;
    }
    
    .client-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
      background-color: #e62e69;
      color: white;
      border-radius: 50%;
      margin-right: 1rem;
    }
    
    .client-details {
      display: flex;
      flex-direction: column;
    }
    
    .client-name {
      font-size: 1.1rem;
      font-weight: 500;
      color: #333;
    }
    
    .session-value {
      font-size: 0.9rem;
      color: #666;
    }
    
    .session-meta {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      align-items: flex-end;
    }
    
    .meta-item {
      display: flex;
      align-items: center;
      color: #666;
      font-size: 0.9rem;
    }
    
    .session-photos {
      display: flex;
      padding: 1.5rem;
      gap: 1rem;
      border-bottom: 1px solid #eee;
    }
    
    .photo-thumbnail {
      position: relative;
      width: 120px;
      height: 120px;
      border-radius: 4px;
      overflow: hidden;
      background-color: #f5f5f5;
    }
    
    .photo-thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    
    .photo-placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      background-color: #f0f0f0;
      color: #999;
      font-size: 0.8rem;
      text-align: center;
      padding: 0.5rem;
    }
    
    .photo-label {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background-color: rgba(0, 0, 0, 0.7);
      color: white;
      text-align: center;
      padding: 0.25rem;
      font-size: 0.8rem;
    }
    
    .session-notes {
      padding: 1.5rem;
      color: #555;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    
    .loading {
      text-align: center;
      padding: 2rem;
      background-color: #f9f9f9;
      border-radius: 8px;
      color: #666;
    }
    
    .empty-state {
      text-align: center;
      padding: 3rem;
      background-color: #f9f9f9;
      border-radius: 8px;
    }
    
    .error-message {
      background-color: #ffebee;
      color: #c62828;
      padding: 0.75rem;
      border-radius: 4px;
      margin-bottom: 1.5rem;
      text-align: center;
    }
    
    .session-detail {
      display: none;
      width: 100%;
    }
    
    .detail-photos {
      flex-direction: column;
      align-items: center;
      gap: 2rem;
    }
    
    .photo-container {
      width: 100%;
    }
    
    .photo-container h3 {
      margin-bottom: 0.5rem;
      color: #333;
    }
    
    .photo-large {
      width: 100%;
      height: 300px;
      border-radius: 8px;
      overflow: hidden;
      background-color: #f5f5f5;
    }
    
    .photo-large img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    
    .back-button {
      display: flex;
      align-items: center;
      padding: 0.5rem 1rem;
      background-color: #f5f5f5;
      border: 1px solid #ddd;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.9rem;
      color: #555;
      transition: all 0.2s;
      margin-bottom: 1rem;
    }
    
    .back-button:hover {
      background-color: #eee;
      border-color: #ccc;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Histórico de Atendimentos</h1>
    </div>
    
    <div id="error-message" class="error-message" style="display: none;"></div>
    
    <div id="loading" class="loading">Carregando histórico...</div>
    
    <div id="empty-state" class="empty-state" style="display: none;">
      <p>Nenhum atendimento registrado ainda.</p>
    </div>
    
    <div id="sessions-list" class="sessions-list" style="display: none;"></div>
    
    <div id="session-detail" class="session-detail"></div>
    
    <div id="debug-log" style="margin-top: 20px; padding: 10px; background-color: #f0f0f0; border: 1px solid #ddd; border-radius: 4px; font-family: monospace; font-size: 12px; white-space: pre-wrap;"></div>
  </div>
  
  <script>
    // Função para adicionar logs de depuração
    function addLog(message) {
      const debugLog = document.getElementById('debug-log');
      const timestamp = new Date().toISOString();
      debugLog.innerHTML += `[${timestamp}] ${message}\n`;
      console.log(message);
    }
    
    // Função para formatar a data
    function formatDate(dateString) {
      const date = new Date(dateString);
      return date.toLocaleDateString('pt-BR', {
        day: '2-digit',
        month: '2-digit',
        year: 'numeric'
      });
    }
    
    // Função para formatar a duração
    function formatDuration(seconds) {
      const hours = Math.floor(seconds / 3600);
      const minutes = Math.floor((seconds % 3600) / 60);
      
      if (hours > 0) {
        return `${hours}h ${minutes}min`;
      } else {
        return `${minutes} minutos`;
      }
    }
    
    // Função para garantir que a URL da imagem seja absoluta
    function getAbsoluteImageUrl(url) {
      if (!url) return null;
      
      addLog(`Processando URL da imagem: ${url}`);
      
      // Se a URL já for absoluta, retorna ela mesma
      if (url.startsWith('http://') || url.startsWith('https://')) {
        addLog(`URL já é absoluta: ${url}`);
        return url;
      }
      
      // Se a URL for relativa, adiciona o host da API
      const apiUrl = 'http://localhost:3002';
      
      // Se a URL começar com /uploads, adiciona apenas o host
      if (url.startsWith('/uploads/')) {
        const fullUrl = `${apiUrl}${url}`;
        addLog(`URL com /uploads: ${fullUrl}`);
        return fullUrl;
      }
      
      // Se a URL não começar com /uploads, adiciona o host e o caminho /uploads/
      if (!url.includes('/uploads/')) {
        const fullUrl = `${apiUrl}/uploads/${url.split('/').pop()}`;
        addLog(`URL sem /uploads: ${fullUrl}`);
        return fullUrl;
      }
      
      const fullUrl = `${apiUrl}${url.startsWith('/') ? '' : '/'}${url}`;
      addLog(`URL processada: ${fullUrl}`);
      return fullUrl;
    }
    
    // Função para mostrar os detalhes de uma sessão
    function showSessionDetail(session) {
      addLog(`Mostrando detalhes da sessão: ${session.clientName}`);
      
      const sessionsList = document.getElementById('sessions-list');
      const sessionDetail = document.getElementById('session-detail');
      
      sessionsList.style.display = 'none';
      sessionDetail.style.display = 'block';
      
      const beforePhotoUrl = session.beforePhoto ? getAbsoluteImageUrl(session.beforePhoto) : null;
      const afterPhotoUrl = session.afterPhoto ? getAbsoluteImageUrl(session.afterPhoto) : null;
      
      addLog(`URL da foto antes: ${beforePhotoUrl}`);
      addLog(`URL da foto depois: ${afterPhotoUrl}`);
      
      sessionDetail.innerHTML = `
        <button class="back-button" onclick="backToList()">← Voltar para lista</button>
        <h2>Detalhes do Atendimento: ${session.clientName}</h2>
        <div class="session-card">
          <div class="session-info">
            <div class="client-info">
              <div class="client-icon">👤</div>
              <div class="client-details">
                <span class="client-name">${session.clientName}</span>
                <span class="session-value">R$ ${parseFloat(session.value).toFixed(2)}</span>
              </div>
            </div>
            
            <div class="session-meta">
              <div class="meta-item">
                📅 <span>${formatDate(session.startTime)}</span>
              </div>
              
              ${session.duration ? `
                <div class="meta-item">
                  ⏱️ <span>${formatDuration(session.duration)}</span>
                </div>
              ` : ''}
            </div>
          </div>
          
          <div class="session-photos detail-photos">
            <div class="photo-container">
              <h3>Antes</h3>
              <div class="photo-large">
                ${beforePhotoUrl ? `
                  <img 
                    src="${beforePhotoUrl}" 
                    alt="Antes" 
                    onerror="addLog('Erro ao carregar imagem antes: ' + this.src); this.parentNode.innerHTML = '<div class=\\'photo-placeholder\\'><span>Imagem não disponível</span></div>'"
                  />
                ` : `
                  <div class="photo-placeholder">
                    <span>Imagem não disponível</span>
                  </div>
                `}
              </div>
            </div>
            
            ${afterPhotoUrl ? `
              <div class="photo-container">
                <h3>Depois</h3>
                <div class="photo-large">
                  <img 
                    src="${afterPhotoUrl}" 
                    alt="Depois" 
                    onerror="addLog('Erro ao carregar imagem depois: ' + this.src); this.parentNode.innerHTML = '<div class=\\'photo-placeholder\\'><span>Imagem não disponível</span></div>'"
                  />
                </div>
              </div>
            ` : ''}
          </div>
          
          ${session.notes ? `
            <div class="session-notes">
              <h3>Observações</h3>
              <p>${session.notes}</p>
            </div>
          ` : ''}
        </div>
      `;
    }
    
    // Função para voltar à lista de sessões
    function backToList() {
      addLog('Voltando para a lista de sessões');
      
      const sessionsList = document.getElementById('sessions-list');
      const sessionDetail = document.getElementById('session-detail');
      
      sessionsList.style.display = 'flex';
      sessionDetail.style.display = 'none';
    }
    
    // Função para carregar as sessões
    async function loadSessions() {
      addLog('Iniciando carregamento das sessões');
      
      const loading = document.getElementById('loading');
      const emptyState = document.getElementById('empty-state');
      const sessionsList = document.getElementById('sessions-list');
      const errorMessage = document.getElementById('error-message');
      
      try {
        const userId = 'demo-user@example.com';
        const apiUrl = `http://localhost:3002/api/strava/${userId}`;
        
        addLog(`Buscando sessões para o usuário ${userId} na URL: ${apiUrl}`);
        
        const response = await fetch(apiUrl);
        
        if (!response.ok) {
          throw new Error(`Falha ao buscar sessões: ${response.status} ${response.statusText}`);
        }
        
        const sessions = await response.json();
        
        addLog(`Sessões encontradas: ${sessions.length}`);
        
        if (sessions.length === 0) {
          loading.style.display = 'none';
          emptyState.style.display = 'block';
          addLog('Nenhuma sessão encontrada');
          return;
        }
        
        // Processar as sessões
        let sessionsHtml = '';
        
        sessions.forEach(session => {
          addLog(`Processando sessão: ${session._id} - ${session.clientName}`);
          
          const beforePhotoUrl = session.beforePhoto ? getAbsoluteImageUrl(session.beforePhoto) : null;
          const afterPhotoUrl = session.afterPhoto ? getAbsoluteImageUrl(session.afterPhoto) : null;
          
          sessionsHtml += `
            <div class="session-card" onclick="showSessionDetail(${JSON.stringify(session).replace(/"/g, '&quot;')})">
              <div class="session-info">
                <div class="client-info">
                  <div class="client-icon">👤</div>
                  <div class="client-details">
                    <span class="client-name">${session.clientName}</span>
                    <span class="session-value">R$ ${parseFloat(session.value).toFixed(2)}</span>
                  </div>
                </div>
                
                <div class="session-meta">
                  <div class="meta-item">
                    📅 <span>${formatDate(session.startTime)}</span>
                  </div>
                  
                  ${session.duration ? `
                    <div class="meta-item">
                      ⏱️ <span>${formatDuration(session.duration)}</span>
                    </div>
                  ` : ''}
                </div>
              </div>
              
              <div class="session-photos">
                <div class="photo-thumbnail">
                  ${beforePhotoUrl ? `
                    <img 
                      src="${beforePhotoUrl}" 
                      alt="Antes" 
                      onerror="addLog('Erro ao carregar thumbnail antes: ' + this.src); this.parentNode.innerHTML = '<div class=\\'photo-placeholder\\'><span>Imagem não disponível</span></div>'"
                    />
                  ` : `
                    <div class="photo-placeholder">
                      <span>Imagem não disponível</span>
                    </div>
                  `}
                  <span class="photo-label">Antes</span>
                </div>
                
                ${afterPhotoUrl ? `
                  <div class="photo-thumbnail">
                    <img 
                      src="${afterPhotoUrl}" 
                      alt="Depois" 
                      onerror="addLog('Erro ao carregar thumbnail depois: ' + this.src); this.parentNode.innerHTML = '<div class=\\'photo-placeholder\\'><span>Imagem não disponível</span></div>'"
                    />
                    <span class="photo-label">Depois</span>
                  </div>
                ` : ''}
              </div>
              
              ${session.notes ? `
                <div class="session-notes">
                  <p>${session.notes}</p>
                </div>
              ` : ''}
            </div>
          `;
        });
        
        sessionsList.innerHTML = sessionsHtml;
        
        loading.style.display = 'none';
        sessionsList.style.display = 'flex';
        
        addLog('Sessões carregadas com sucesso');
      } catch (err) {
        console.error('Erro ao buscar sessões:', err);
        addLog(`ERRO: ${err.message}`);
        
        loading.style.display = 'none';
        errorMessage.textContent = `Ocorreu um erro ao buscar o histórico de atendimentos: ${err.message}`;
        errorMessage.style.display = 'block';
      }
    }
    
    // Carregar as sessões quando a página carregar
    window.addEventListener('load', () => {
      addLog('Página carregada, iniciando aplicação');
      loadSessions();
    });
  </script>
</body>
</html>
